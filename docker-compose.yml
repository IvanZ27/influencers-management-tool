services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  server:
    build: ./server
    container_name: server
    command: npm run dev
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "1337:1337"
    depends_on:
      - db
    env_file:
      - ./server/.env.docker

  client:
    build: ./client
    container_name: client
    command: npm run dev
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - DOCKER=true
    env_file:
      - ./client/.env.docker
    depends_on: [server]

volumes:
  db-data:
